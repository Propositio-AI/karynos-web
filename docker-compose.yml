services:
    web:
        build:
            context: .
            dockerfile: Dockerfile.dev
        container_name: karynos-web-dev
        ports:
            - "3000:3000"
        env_file:
            - .env.local
        environment:
            CHOKIDAR_USEPOLLING: "true"
            WATCHPACK_POLLING: "true"
            NEXT_TELEMETRY_DISABLED: "1"
        volumes:
            - .:/app
            - /app/node_modules
            - /app/.next
        command: npm run dev -- --hostname 0.0.0.0 --port 3000
        stdin_open: true
        tty: true
